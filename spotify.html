<!DOCTYPE html>
<html>
<head>
<title>Music Streaming UI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    background:#121212;
    color:white;
}

/* Sidebar */

.sidebar{
    width:220px;
    height:100vh;
    background:#000;
    padding:20px;
}

.sidebar h2{
    color:#1DB954;
    margin-bottom:25px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    margin:15px 0;
}

.sidebar a:hover{
    color:#1DB954;
}

/* Main */

.main{
    flex:1;
    padding:30px;
}

.main h1{
    margin-bottom:25px;
}

.albums{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
}

.card{
    background:#1e1e1e;
    padding:20px;
    border-radius:10px;
    text-align:center;
    transition:.3s;
}

.card:hover{
    background:#282828;
    transform:translateY(-8px);
}

.cover{
    height:140px;
    border-radius:10px;
    background:linear-gradient(135deg,#1DB954,#0a7c3f);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:45px;
    margin-bottom:15px;
}

button{
    margin-top:15px;
    padding:10px 18px;
    border:none;
    border-radius:25px;
    background:#1DB954;
    color:white;
    cursor:pointer;
}

/* Bottom Player */

.player{
    position:fixed;
    bottom:0;
    left:220px;
    right:0;
    background:#181818;
    padding:18px;
    display:flex;
    justify-content:space-between;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>Spotify</h2>

<a href="#">🏠 Home</a>
<a href="#">🔍 Search</a>
<a href="#">❤️ Liked Songs</a>
<a href="#">🎵 Playlists</a>

</div>

<div class="main">

<h1>Trending Albums</h1>

<div class="albums">

<div class="card">
<div class="cover">🎧</div>
<h3>Midnight Vibes</h3>
<p>25 Songs</p>
<button>Play</button>
</div>

<div class="card">
<div class="cover">🎸</div>
<h3>Rock Hits</h3>
<p>18 Songs</p>
<button>Play</button>
</div>

<div class="card">
<div class="cover">🎤</div>
<h3>Top Pop</h3>
<p>30 Songs</p>
<button>Play</button>
</div>

<div class="card">
<div class="cover">🎼</div>
<h3>Classical</h3>
<p>15 Songs</p>
<button>Play</button>
</div>

</div>

</div>

<div class="player">

<p>🎵 Now Playing: Midnight Vibes</p>

<p>⏮ ⏯ ⏭</p>

</div>

</body>
</html>
