<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevHub — Mini GitHub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#0d1117;
    --panel:#161b22;
    --panel2:#21262d;
    --border:#30363d;
    --text:#f0f6fc;
    --muted:#8b949e;
    --blue:#58a6ff;
    --green:#3fb950;
    --red:#f85149;
    --yellow:#d29922;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,input,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

header{
    height:64px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    padding:0 28px;
    gap:22px;
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(13,17,23,.95);
    backdrop-filter:blur(12px);
}

.logo{
    font-size:22px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:9px;
}

.logo span{
    color:var(--blue);
}

.search{
    width:330px;
    position:relative;
}

.search input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:white;
    padding:9px 13px;
    border-radius:7px;
    outline:none;
}

.search input:focus{
    border-color:var(--blue);
}

.header-right{
    margin-left:auto;
    display:flex;
    gap:10px;
    align-items:center;
}

.avatar{
    width:34px;
    height:34px;
    border-radius:50%;
    background:linear-gradient(135deg,#58a6ff,#bc8cff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
}

.layout{
    display:flex;
    min-height:calc(100vh - 64px);
}

.sidebar{
    width:245px;
    border-right:1px solid var(--border);
    padding:24px 15px;
    flex-shrink:0;
}

.sidebar h4{
    color:var(--muted);
    font-size:12px;
    text-transform:uppercase;
    margin:16px 12px 9px;
}

.nav-item{
    width:100%;
    padding:10px 13px;
    border:0;
    background:transparent;
    color:var(--muted);
    text-align:left;
    border-radius:7px;
    margin-bottom:3px;
}

.nav-item:hover,
.nav-item.active{
    background:var(--panel2);
    color:white;
}

.main{
    flex:1;
    padding:35px;
    max-width:1250px;
}

.page-title{
    font-size:27px;
    margin-bottom:8px;
}

.subtitle{
    color:var(--muted);
    margin-bottom:30px;
}

.btn{
    border:1px solid var(--border);
    background:var(--panel2);
    color:white;
    padding:8px 15px;
    border-radius:7px;
}

.btn:hover{
    border-color:#8b949e;
}

.btn.primary{
    background:#238636;
    border-color:#2ea043;
}

.btn.primary:hover{
    background:#2ea043;
}

.btn.blue{
    background:#1f6feb;
    border-color:#388bfd;
}

.btn.danger{
    background:#da3633;
    border-color:#f85149;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:30px;
}

.stat{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:20px;
}

.stat .number{
    font-size:27px;
    font-weight:700;
    margin-bottom:5px;
}

.stat .label{
    color:var(--muted);
    font-size:13px;
}

.repo-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.repo{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:9px;
    padding:20px;
    transition:.2s;
}

.repo:hover{
    border-color:#8b949e;
    transform:translateY(-2px);
}

.repo-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.repo-name{
    color:var(--blue);
    font-weight:600;
    font-size:17px;
    cursor:pointer;
}

.repo-description{
    color:var(--muted);
    margin:12px 0;
    font-size:14px;
    line-height:1.5;
}

.language{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12px;
    color:var(--muted);
}

.dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#f1e05a;
}

.repo-meta{
    display:flex;
    gap:18px;
    color:var(--muted);
    font-size:12px;
    margin-top:16px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:9px;
    overflow:hidden;
}

.repo-header{
    padding:25px;
    border-bottom:1px solid var(--border);
}

.breadcrumb{
    color:var(--blue);
    font-size:20px;
    margin-bottom:17px;
}

.repo-tabs{
    display:flex;
    gap:25px;
    margin-top:25px;
}

.tab{
    background:none;
    border:0;
    color:var(--muted);
    padding-bottom:12px;
}

.tab.active{
    color:white;
    border-bottom:2px solid #f78166;
}

.file{
    display:flex;
    align-items:center;
    padding:13px 18px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
}

.file:last-child{
    border-bottom:0;
}

.file:hover{
    background:var(--panel2);
}

.file-icon{
    width:30px;
}

.file-name{
    color:var(--blue);
    flex:1;
}

.file-message{
    color:var(--muted);
    font-size:13px;
}

.file-time{
    color:var(--muted);
    font-size:12px;
    margin-left:30px;
}

.commit-box{
    padding:20px;
    border-bottom:1px solid var(--border);
}

.commit{
    display:flex;
    gap:14px;
    align-items:center;
}

.commit-avatar{
    width:35px;
    height:35px;
    border-radius:50%;
    background:linear-gradient(135deg,#ff7b72,#d2a8ff);
}

.commit-info{
    flex:1;
}

.commit-title{
    color:var(--blue);
}

.commit-sub{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.issue{
    padding:20px;
    border-bottom:1px solid var(--border);
}

.issue-title{
    color:var(--blue);
    font-size:16px;
    margin-bottom:8px;
}

.issue-meta{
    color:var(--muted);
    font-size:12px;
}

.open{
    color:var(--green);
}

.closed{
    color:var(--red);
}

.editor{
    background:#010409;
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
}

.editor-header{
    padding:10px 15px;
    background:var(--panel2);
    display:flex;
    justify-content:space-between;
}

textarea.code{
    width:100%;
    min-height:500px;
    resize:vertical;
    background:#010409;
    color:#e6edf3;
    border:0;
    outline:0;
    padding:20px;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:14px;
    line-height:1.6;
}

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:450px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:25px;
}

.modal h2{
    margin-bottom:20px;
}

.field{
    margin-bottom:16px;
}

.field label{
    display:block;
    font-size:13px;
    margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
    width:100%;
    background:#0d1117;
    border:1px solid var(--border);
    color:white;
    padding:10px;
    border-radius:6px;
    outline:none;
}

.field textarea{
    min-height:90px;
    resize:vertical;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
}

.empty{
    padding:60px;
    text-align:center;
    color:var(--muted);
}

.toast{
    position:fixed;
    right:25px;
    bottom:25px;
    background:#238636;
    color:white;
    padding:13px 18px;
    border-radius:8px;
    transform:translateY(100px);
    opacity:0;
    transition:.3s;
    z-index:200;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

.profile{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:30px;
}

.big-avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    background:linear-gradient(135deg,#58a6ff,#bc8cff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:700;
}

.profile h1{
    margin-bottom:5px;
}

.profile p{
    color:var(--muted);
}

.activity{
    padding:20px;
    border-bottom:1px solid var(--border);
}

.activity strong{
    color:var(--blue);
}

@media(max-width:900px){
    .sidebar{
        width:70px;
    }

    .sidebar h4,
    .nav-item span{
        display:none;
    }

    .nav-item{
        text-align:center;
    }

    .main{
        padding:20px;
    }

    .repo-grid{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .search{
        width:200px;
    }
}

@media(max-width:600px){
    header{
        padding:0 12px;
    }

    .search{
        display:none;
    }

    .main{
        padding:15px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">◉ <span>DevHub</span></div>

    <div class="search">
        <input
            id="searchInput"
            placeholder="Search repositories..."
            oninput="searchRepos()"
        >
    </div>

    <div class="header-right">
        <button class="btn" onclick="showModal()">＋ New</button>
        <div class="avatar">B</div>
    </div>
</header>

<div class="layout">

<aside class="sidebar">

    <button class="nav-item active" onclick="navigate('dashboard',this)">
        🏠 <span>Dashboard</span>
    </button>

    <button class="nav-item" onclick="navigate('repositories',this)">
        📁 <span>Repositories</span>
    </button>

    <button class="nav-item" onclick="navigate('issues',this)">
        🐛 <span>Issues</span>
    </button>

    <button class="nav-item" onclick="navigate('commits',this)">
        📜 <span>Commits</span>
    </button>

    <h4>Account</h4>

    <button class="nav-item" onclick="navigate('profile',this)">
        👤 <span>Profile</span>
    </button>

</aside>

<main class="main" id="app"></main>

</div>

<!-- CREATE REPOSITORY MODAL -->

<div class="modal-bg" id="modal">

<div class="modal">

<h2>Create repository</h2>

<div class="field">
<label>Repository name</label>
<input id="repoName" placeholder="my-awesome-project">
</div>

<div class="field">
<label>Description</label>
<textarea id="repoDescription" placeholder="What does this project do?"></textarea>
</div>

<div class="field">
<label>Language</label>
<select id="repoLanguage">
<option>JavaScript</option>
<option>TypeScript</option>
<option>Python</option>
<option>Java</option>
<option>HTML</option>
<option>CSS</option>
</select>
</div>

<div class="modal-actions">
<button class="btn" onclick="hideModal()">Cancel</button>
<button class="btn primary" onclick="createRepo()">Create repository</button>
</div>

</div>
</div>

<div class="toast" id="toast"></div>

<script>

/* ==============================
   DATA
================================ */

const defaultRepos = [

{
    id:1,
    name:"campusmesh",
    description:"A peer-to-peer campus marketplace and delivery platform.",
    language:"JavaScript",
    stars:128,
    forks:21,
    files:[
        {name:"src",type:"folder",message:"Refactor delivery flow"},
        {name:"README.md",type:"file",message:"Update documentation"},
        {name:"package.json",type:"file",message:"Add dependencies"},
        {name:"index.html",type:"file",message:"Initial commit"},
        {name:"app.js",type:"file",message:"Implement realtime tracking"}
    ],
    commits:[
        {title:"Implement realtime delivery tracking",author:"Bhoomika",time:"2 hours ago"},
        {title:"Add delivery partner matching",author:"Bhoomika",time:"Yesterday"},
        {title:"Initial project setup",author:"Bhoomika",time:"4 days ago"}
    ]
},

{
    id:2,
    name:"safescan",
    description:"Intelligent document and QR verification platform.",
    language:"JavaScript",
    stars:87,
    forks:12,
    files:[
        {name:"frontend",type:"folder",message:"Improve dashboard"},
        {name:"backend",type:"folder",message:"API updates"},
        {name:"README.md",type:"file",message:"Documentation"},
        {name:"server.js",type:"file",message:"Authentication API"}
    ],
    commits:[
        {title:"Add verification pipeline",author:"Amruth",time:"Yesterday"},
        {title:"Improve dashboard",author:"Bhoomika",time:"3 days ago"}
    ]
},

{
    id:3,
    name:"peerflow",
    description:"Peer-to-peer resource sharing system for students.",
    language:"TypeScript",
    stars:54,
    forks:7,
    files:[
        {name:"components",type:"folder",message:"UI improvements"},
        {name:"README.md",type:"file",message:"Update README"},
        {name:"main.ts",type:"file",message:"Initial implementation"}
    ],
    commits:[
        {title:"Add resource matching",author:"Prajwal",time:"2 days ago"},
        {title:"Initial commit",author:"Prajwal",time:"1 week ago"}
    ]
}

];

let repos = JSON.parse(localStorage.getItem("devhub_repos")) || defaultRepos;

let currentRepo = null;

let currentFile = null;

/* ==============================
   UTILITIES
================================ */

function save(){

    localStorage.setItem(
        "devhub_repos",
        JSON.stringify(repos)
    );

}

function toast(message){

    const t = document.getElementById("toast");

    t.textContent = message;

    t.classList.add("show");

    setTimeout(()=>{
        t.classList.remove("show");
    },2500);

}

/* ==============================
   NAVIGATION
================================ */

function navigate(page,element){

    document
        .querySelectorAll(".nav-item")
        .forEach(x=>x.classList.remove("active"));

    if(element){
        element.classList.add("active");
    }

    if(page==="dashboard")
        dashboard();

    if(page==="repositories")
        repositories();

    if(page==="issues")
        issues();

    if(page==="commits")
        commits();

    if(page==="profile")
        profile();

}

/* ==============================
   DASHBOARD
================================ */

function dashboard(){

    currentRepo=null;

    let stars = repos.reduce(
        (sum,r)=>sum+r.stars,0
    );

    let forks = repos.reduce(
        (sum,r)=>sum+r.forks,0
    );

    let files = repos.reduce(
        (sum,r)=>sum+r.files.length,0
    );

    document.getElementById("app").innerHTML = `

        <h1 class="page-title">
            Good evening, Bhoomika 👋
        </h1>

        <p class="subtitle">
            Here's what's happening across your projects.
        </p>

        <div class="stats">

            <div class="stat">
                <div class="number">${repos.length}</div>
                <div class="label">Repositories</div>
            </div>

            <div class="stat">
                <div class="number">${stars}</div>
                <div class="label">Total Stars</div>
            </div>

            <div class="stat">
                <div class="number">${forks}</div>
                <div class="label">Total Forks</div>
            </div>

            <div class="stat">
                <div class="number">${files}</div>
                <div class="label">Tracked Files</div>
            </div>

        </div>

        <div class="section-header">
            <h2>Popular repositories</h2>

            <button class="btn primary"
                onclick="showModal()">
                New repository
            </button>
        </div>

        <div class="repo-grid">

            ${repos
                .slice()
                .sort((a,b)=>b.stars-a.stars)
                .map(repoCard)
                .join("")}

        </div>
    `;

}

function repoCard(repo){

    return `

    <div class="repo">

        <div class="repo-top">

            <div
                class="repo-name"
                onclick="openRepo(${repo.id})"
            >
                ${repo.name}
            </div>

            <button
                class="btn"
                onclick="starRepo(${repo.id})"
            >
                ★ ${repo.stars}
            </button>

        </div>

        <div class="repo-description">
            ${repo.description}
        </div>

        <div class="language">
            <span class="dot"></span>
            ${repo.language}
        </div>

        <div class="repo-meta">
            <span>★ ${repo.stars}</span>
            <span>⑂ ${repo.forks}</span>
            <span>◉ ${repo.files.length} files</span>
        </div>

    </div>

    `;

}

/* ==============================
   REPOSITORIES
================================ */

function repositories(){

    currentRepo=null;

    document.getElementById("app").innerHTML = `

        <div class="section-header">

            <div>
                <h1 class="page-title">Repositories</h1>
                <p class="subtitle">
                    ${repos.length} repositories
                </p>
            </div>

            <button
                class="btn primary"
                onclick="showModal()"
            >
                ＋ New repository
            </button>

        </div>

        <div id="repoList">

            ${repos.map(repoCard).join("")}

        </div>
    `;

}

/* ==============================
   SEARCH
================================ */

function searchRepos(){

    const query =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase();

    const filtered =
        repos.filter(r =>
            r.name.toLowerCase().includes(query) ||
            r.description.toLowerCase().includes(query)
        );

    const list =
        document.getElementById("repoList");

    if(!list) return;

    list.innerHTML =
        filtered.length
        ? filtered.map(repoCard).join("")
        : `<div class="empty">No repositories found.</div>`;

}

/* ==============================
   REPOSITORY
================================ */

function openRepo(id){

    currentRepo =
        repos.find(r=>r.id===id);

    renderRepo();

}

function renderRepo(){

    const repo=currentRepo;

    document.getElementById("app").innerHTML=`

        <div class="panel">

            <div class="repo-header">

                <div class="breadcrumb">
                    👤 Bhoomika /
                    <strong>${repo.name}</strong>
                </div>

                <p class="subtitle">
                    ${repo.description}
                </p>

                <div style="display:flex;gap:10px">

                    <button
                        class="btn"
                        onclick="starRepo(${repo.id})"
                    >
                        ★ ${repo.stars}
                    </button>

                    <button
                        class="btn"
                        onclick="toast('Fork created!')"
                    >
                        ⑂ Fork ${repo.forks}
                    </button>

                    <button
                        class="btn blue"
                        onclick="newCommit()"
                    >
                        Commit changes
                    </button>

                </div>

                <div class="repo-tabs">

                    <button
                        class="tab active"
                        onclick="repoFiles()"
                    >
                        📁 Code
                    </button>

                    <button
                        class="tab"
                        onclick="repoCommits()"
                    >
                        📜 Commits
                    </button>

                    <button
                        class="tab"
                        onclick="repoIssues()"
                    >
                        🐛 Issues
                    </button>

                </div>

            </div>

            <div id="repoContent"></div>

        </div>

    `;

    repoFiles();

}

function repoFiles(){

    const repo=currentRepo;

    document.getElementById("repoContent").innerHTML=`

        <div style="padding:15px">

            <select
                class="btn"
                onchange="toast('Branch switched to '+this.value)"
            >
                <option>main</option>
                <option>development</option>
                <option>feature/realtime</option>
            </select>

        </div>

        <div>

            ${repo.files.map((file,i)=>`

                <div
                    class="file"
                    onclick="openFile(${i})"
                >

                    <div class="file-icon">
                        ${file.type==="folder" ? "📁":"📄"}
                    </div>

                    <div class="file-name">
                        ${file.name}
                    </div>

                    <div class="file-message">
                        ${file.message}
                    </div>

                    <div class="file-time">
                        2 days ago
                    </div>

                </div>

            `).join("")}

        </div>
    `;

}

/* ==============================
   FILE EDITOR
================================ */

function openFile(index){

    const file=currentRepo.files[index];

    if(file.type==="folder"){

        toast("Folder opened: "+file.name);

        return;
    }

    currentFile=file;

    let content =
`// ${file.name}

function initializeApplication() {

    console.log("DevHub project initialized");

    return {
        status: "running",
        version: "1.0.0"
    };
}

initializeApplication();
`;

    document.getElementById("repoContent").innerHTML=`

        <div style="padding:15px">

            <button
                class="btn"
                onclick="repoFiles()"
            >
                ← Back to files
            </button>

        </div>

        <div class="editor">

            <div class="editor-header">

                <span>
                    📄 ${file.name}
                </span>

                <button
                    class="btn primary"
                    onclick="saveFile()"
                >
                    Save
                </button>

            </div>

            <textarea
                class="code"
                id="codeEditor"
            >${content}</textarea>

        </div>

    `;

}

function saveFile(){

    const code =
        document.getElementById("codeEditor").value;

    currentFile.content=code;

    save();

    toast("Changes saved successfully ✓");

}

/* ==============================
   COMMITS
================================ */

function repoCommits(){

    document.getElementById("repoContent").innerHTML=

    currentRepo.commits.map(c=>`

        <div class="commit-box">

            <div class="commit">

                <div class="commit-avatar"></div>

                <div class="commit-info">

                    <div class="commit-title">
                        ${c.title}
                    </div>

                    <div class="commit-sub">
                        ${c.author} committed ${c.time}

function starRepo(id){

    const repo =
        repos.find(r=>r.id===id);

    repo.stars++;

    save();

    toast(`★ Starred ${repo.name}`);

    if(currentRepo)
        renderRepo();
    else
        dashboard();

}

/* ==============================
   CREATE REPOSITORY
================================ */

function showModal(){

    document
        .getElementById("modal")
        .classList.add("show");

}

function hideModal(){

    document
        .getElementById("modal")
        .classList.remove("show");

}

function createRepo(){

    const name =
        document.getElementById("repoName").value.trim();

    const description =
        document.getElementById("repoDescription").value.trim();

    const language =
        document.getElementById("repoLanguage").value;

    if(!name){

        toast("Repository name is required");

        return;
    }

    const newRepo={

        id:Date.now(),

        name:name,

        description:
            description || "A new DevHub repository.",

        language:language,

        stars:0,

        forks:0,

        files:[

            {
                name:"README.md",
                type:"file",
                message:"Initial commit"
            },

            {
                name:"index.html",
                type:"file",
                message:"Initial commit"
            }

        ],

        commits:[

            {
                title:"Initial commit",
                author:"Bhoomika",
                time:"just now"
            }

        ]

    };

    repos.unshift(newRepo);

    save();

    hideModal();

    document.getElementById("repoName").value="";
    document.getElementById("repoDescription").value="";

    toast("Repository created successfully 🚀");

    dashboard();

}
