<!DOCTYPE html>
<html>
<head>
  <title>Profile Card</title>
  <style>
    body {
  background-color:yellow;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  margin-top: 100px;
}

.profile-card {
  display: flex;
  align-items: center;
  gap: 20px;
  background-color: beige;
  padding: 20px;
  border-radius: 12px;
}

.profile-img {
  width: 200px;
  border-radius: 12px;
  flex-direction: column;
  display:flex;
  align-items: center;
}

.profile-text {
  display: flex;
  flex-direction: row;
  gap: 10px;
}

button {
  width: fit-content;
  background-color: black;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 6px;
}

  </style>
</head>
<body>

  <div class="profile-card">
    <img src="me.png" class="profile-img" alt="Bhoomika">

    <div class="profile-text">
      <h2>Bhoomika</h2>
      <p>I am Learning FrontEnd now and I am Happy to be a part of it </p>
      <button>Contact</button>
    </div>
  </div>

</body>
</html>
