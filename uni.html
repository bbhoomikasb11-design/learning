<!DOCTYPE html>
<html>
<head>
<title>University Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    display:flex;
    background:#f4f4f4;
}

/* Sidebar */

.sidebar{
    width:220px;
    height:100vh;
    background:#1e293b;
    color:white;
    padding:20px;
}

.sidebar h2{
    margin-bottom:30px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:12px;
    margin:8px 0;
    border-radius:6px;
}

.sidebar a:hover{
    background:#2563eb;
}

/* Main */

.main{
    flex:1;
    padding:30px;
}

h1{
    margin-bottom:25px;
}

/* Cards */

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.card h2{
    color:#2563eb;
}

/* Table */

table{
    width:100%;
    margin-top:30px;
    background:white;
    border-collapse:collapse;
}

th,td{
    padding:15px;
    border:1px solid #ddd;
    text-align:center;
}

th{
    background:#2563eb;
    color:white;
}

</style>

</head>
<body>

<div class="sidebar">

<h2>Dashboard</h2>

<a href="#">🏠 Home</a>
<a href="#">📚 Courses</a>
<a href="#">✅ Attendance</a>
<a href="#">📝 Assignments</a>
<a href="#">📊 Results</a>
<a href="#">⚙ Settings</a>

</div>

<div class="main">

<h1>Welcome, Bhoomika 👋</h1>

<div class="cards">

<div class="card">
<h2>92%</h2>
<p>Attendance</p>
</div>

<div class="card">
<h2>9.1</h2>
<p>CGPA</p>
</div>

<div class="card">
<h2>6</h2>
<p>Assignments</p>
</div>

<div class="card">
<h2>12</h2>
<p>Courses</p>
</div>

</div>

<table>

<tr>
<th>Course</th>
<th>Faculty</th>
<th>Time</th>
</tr>

<tr>
<td>Web Technology</td>
<td>Priya</td>
<td>9:00 AM</td>
</tr>

<tr>
<td>AI</td>
<td>Rahul</td>
<td>11:00 AM</td>
</tr>

<tr>
<td>DBMS</td>
<td>Anita</td>
<td>2:00 PM</td>
</tr>

</table>

</div>

</body>
</html>
