<!DOCTYPE html>
<html lang="en">
    <head>

        <style>
            p{
                background-color: beige;
                color: black;

                font-size: bold;
            }
            .btn{
                background-color: blanchedalmond;

                background:black;

color:white;
            }
button:hover{

background:black;
transform:scale(1.1);

color:white;

}

width:300px;

.cards{

.products{

200px

200px;

}
.gallery{

display:grid;

grid-template-columns:

repeat(3,1fr);

gap:20px;
color: black;
}
