<!DOCTYPE html>
<html>
    <head>
        <title>Forms</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

        <style>
input,textarea,select{
    padding:12px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 10px;
}
input:focus {
  outline: none;
  border-color: #2ecc71;
}
input[type="checkbox"] {
  accent-color: #2ecc71;
}
select {
  appearance: base-select;
}
body{
    display: flex;
    justify-content: center;
    background-color: #32678f;
    color:black;
      font-family: 'Inter', system-ui, sans-serif;

}
.grid{
    display: grid;
    grid-template-columns: auto;
    border: 2px solid white;
    padding:20px;
    max-width: auto;
    height: auto;
background-color: rgb(59, 98, 98);
margin:100px;
}


        </style>
    </head>
    <body>
        <div class="grid">
        <h2>Contact Form</h2>

<form class="form">

  <!-- Text input -->
  <label>
    Name
    <br>
    <input type="text" placeholder="Enter your name">
  </label>

  <br><br>

  <!-- Email input -->
  <label>
    Email
    <br>
    <input type="email" placeholder="Enter your email">
  </label>

  <br><br>

  <!-- Textarea -->
  <label>
    Message
    <br>
    <textarea rows="4" placeholder="Write your message"></textarea>
  </label>

  <br><br>

  <!-- Select -->
  <label>
    Topic
    <br>
    <select>
      <option>Select a topic</option>
      <option>Design</option>
      <option>Frontend</option>
      <option>UI/UX</option>
    </select>
  </label>

  <br><br>

  <!-- Checkbox -->
  <label>
    <input type="checkbox">
    I agree to the terms
  </label>

  <br><br>

  <!-- Button -->
  <button type="submit">Submit</button>

</form>
</div>

    </body>
</html>
