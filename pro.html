<!DOCTYPE html>
<html>
    <head>
        <title>
         Responsive Feature Cards Section
   
        </title>
        <style>
:root {
  --primary: #2ecc71;
  --bg: #f4f4f4;
  --radius: 10px;
  --space: 20px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: var(--space);

}
.card{
    border:3px solid black;
    text-align: center;
    background-color: var(--primary);
}
.card:hover {
  transform: translateY(-6px);
}
body{
    background-color: var(--bg);
    justify-content: center;
}
.btn:hover{
    transform: translateY(-6px);
background-color: rgb(36, 77, 42);
      color: white;
}
.features{
    text-align: center;
}

        </style>
    </head>
    <body>
        <section class="features">
    <h2>Our Services</h2>
    <p class="subtitle">What we offer to help you grow</p>

    <div class="grid">
      <div class="card">
        <h3>Design</h3>
        <p>Clean and modern UI solutions.</p>
        <button class="btn">Learn more</button>
      </div>

      <div class="card">
        <h3>Development</h3>
        <p>Scalable and performant web apps.</p>
        <button class="btn">Learn more</button>
      </div>

      <div class="card">
        <h3>Support</h3>
        <p>We help you at every step.</p>
        <button class="btn">Learn more</button>
      </div>
    </div>
  </section>


    </body>
</html>
