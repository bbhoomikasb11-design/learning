<!DOCTYPE html>
<html>
<head>
  <title>Task 5 - Flexbox Profile Card</title>
  <style>
    body {
      background-color: #f4f4f4;
      font-family: Arial;
      display: flex;
      justify-content: center;
      margin-top: 100px;
    }

    
    .box {
      display: flex;               
      gap: 20px;
      padding: 20px;
      width: 500px;
      background-color: blanchedalmond;
      border-radius: 10px;
      align-items: center;
    }

   
    .image {
      width: 120px;
      border-radius: 8px;
      transition: 0.3s;
    }

    .image:hover {
      transform: scale(1.05);
    }

    
    .para {
      display: flex;
      flex-direction: column;
      gap: 12px;
      color: black;
    }

    .para p {
      margin: 0;
      line-height: 1.4;
    }

    .btn {
      width: fit-content;
      background-color: gold;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: aliceblue;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    @media(max-width:600px){
        .box{
            display: flex;
        flex-direction: column; 
        }
        .para{
            font-size: 18px;
 
        }
    }
  </style>
</head>

<body>

  <div class="box">
    <img src="bhoo.jpg" alt="Bhoomika" class="image">

    <div class="para">
      <p>
        Hi, I am Bhoomika. I am someone who thinks deeply, values meaning, and loves design.
        I care about how users feel when they interact with an interface and always try
        to improve clarity and comfort.
      </p>
      <button class="btn">Okay</button>
    </div>
  </div>

</body>
</html>
