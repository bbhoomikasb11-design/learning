<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .calculator {
            width: 330px;
            padding: 20px;
            background: #222;
            border-radius: 18px;
            box-shadow: 0 10px 30px #aaa;
        }

        #display {
            width: 100%;
            height: 70px;
            margin-bottom: 15px;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: white;
            font-size: 30px;
            text-align: right;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.03);
        }

        .operator {
            background: orange;
            color: white;
        }

        .clear {
            background: #e74c3c;
            color: white;
        }

        .equal {
            background: #2ecc71;
            color: white;
        }

    </style>

</head>


<body>

    <div class="calculator">

        <input
            id="display"
            type="text"
            value="0"
            readonly
        >


        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">AC</button>

            <button onclick="deleteLast()">⌫</button>

            <button onclick="addToDisplay('%')">%</button>

            <button
                class="operator"
                onclick="addToDisplay('/')">
                ÷
            </button>


            <button onclick="addToDisplay('7')">7</button>

            <button onclick="addToDisplay('8')">8</button>

            <button onclick="addToDisplay('9')">9</button>

            <button
                class="operator"
                onclick="addToDisplay('*')">
                ×
            </button>


            <button onclick="addToDisplay('4')">4</button>

            <button onclick="addToDisplay('5')">5</button>

            <button onclick="addToDisplay('6')">6</button>

            <button
                class="operator"
                onclick="addToDisplay('-')">
                −
            </button>


            <button onclick="addToDisplay('1')">1</button>

            <button onclick="addToDisplay('2')">2</button>

            <button onclick="addToDisplay('3')">3</button>

            <button
                class="operator"
                onclick="addToDisplay('+')">
                +
            </button>


            <button onclick="addToDisplay('0')">0</button>

            <button onclick="addToDisplay('.')">.</button>

            <button
                class="equal"
                onclick="calculate()">
                =
            </button>

        </div>

    </div>


    <script>

        // Get display
        const display =
            document.getElementById("display");


        // Add numbers/operators
        function addToDisplay(value) {

            if (display.value === "0") {

                display.value = value;

            } else {

                display.value += value;

            }

        }


        // Clear everything
        function clearDisplay() {

            display.value = "0";

        }


        // Delete last character
        function deleteLast() {

            display.value =
                display.value.slice(0, -1);

            if (display.value === "") {

                display.value = "0";

            }

        }


        // Calculate result
        function calculate() {

            try {

                display.value =
                    eval(display.value);

            } catch {

                display.value = "Error";

            }

        }

    </script>

</body>

</html>
