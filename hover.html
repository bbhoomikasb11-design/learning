<!DOCTYPE html>
<html>
<head>
  <title>Let's Try</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    .first {
      color: blueviolet;
      text-align: center;
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    }

    .btn {
      background-color: black;
      color: aliceblue;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      transition: 0.3s;
      cursor: pointer;
    }

    .btn:hover {
      background-color: aquamarine;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);

    }

    .img-view {
      width: 250px;
      border-radius: 10px;
      transition: 0.3s;
    }

    .img-view:hover {
      transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.25);

    }
    @media (max-width: 600px) {

  h1 {
    font-size: 24px;
  }

  p {
    font-size: 16px;
  }

  .img-view {
    width: 180px;
  }

  .btn {
    padding: 10px 16px;
  }
}

  </style>
</head>

<body>
  <div class="first">
    <h1>Bhoomika</h1>
    <p>Hello everyone, happy to see you</p>

    <button type="submit" class="btn">Submit</button><br><br>

    <img src="me.png" class="img-view" alt="image">
  </div>
</body>
</html>
