<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Events - Multi-Step Form</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --error: #f87171;
      --success: #4ade80;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .form-card {
      background-color: var(--surface);
      border-radius: 0.75rem;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
    }

    /* Progress Indicator */
    .progress-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 2rem;
      position: relative;
    }

    .progress-step {
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      background-color: var(--bg);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--text-muted);
      z-index: 1;
    }

    .progress-step.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .progress-step.completed {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }

    /* Form Steps */
    .step {
      display: none;
      flex-direction: column;
      gap: 1.25rem;
    }

    .step.active {
      display: flex;
    }

    .step-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    label {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    input, select {
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      padding: 0.75rem;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    input.invalid {
      border-color: var(--error);
    }

    input.valid {
      border-color: var(--success);
    }

    .error-msg {
      color: var(--error);
      font-size: 0.75rem;
      min-height: 1rem;
    }

    /* Navigation Buttons */
    .btn-group {
      display: flex;
      justify-content: space-between;
      margin-top: 1.5rem;
      gap: 1rem;
    }

    button {
      padding: 0.75rem 1.25rem;
      border-radius: 0.375rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    .btn-prev {
      background-color: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-next, .btn-submit {
      background-color: var(--accent);
      color: var(--bg);
      margin-left: auto;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <div class="progress-bar">
      <div class="progress-step active" id="p-1">1</div>
      <div class="progress-step" id="p-2">2</div>
      <div class="progress-step" id="p-3">3</div>
    </div>

    <form id="multiStepForm" novalidate>
      <div class="step active" data-step="1">
        <h2 class="step-title">Personal Details</h2>
        
        <div class="field-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="Jane Doe" required minlength="3">
          <span class="error-msg"></span>
        </div>

        <div class="field-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="jane@example.com" required>
          <span class="error-msg"></span>
        </div>
      </div>

      <div class="step" data-step="2">
        <h2 class="step-title">Account Setup</h2>
        
        <div class="field-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="janedoe99" required minlength="4">
          <span class="error-msg"></span>
        </div>

        <div class="field-group">
          <label for="password">Password (Min 6 chars)</label>
          <input type="password" id="password" placeholder="••••••••" required minlength="6">
          <span class="error-msg"></span>
        </div>
      </div>

      <div class="step" data-step="3">
        <h2 class="step-title">Preferences</h2>
        
        <div class="field-group">
          <label for="role">Primary Role</label>
          <select id="role" required>
            <option value="">Select a role...</option>
            <option value="developer">Developer</option>
            <option value="designer">Designer</option>
            <option value="student">Student</option>
          </select>
          <span class="error-msg"></span>
        </div>
      </div>

      <div class="btn-group">
        <button type="button" class="btn-prev" id="prevBtn" style="display: none;">Back</button>
        <button type="button" class="btn-next" id="nextBtn">Next</button>
        <button type="submit" class="btn-submit" id="submitBtn" style="display: none;">Submit</button>
      </div>

      <p class="hint">Tip: Use <strong>Enter</strong> to advance or <strong>Esc</strong> to reset</p>
    </form>
  </div>

  <script>
    let currentStep = 1;
    const totalSteps = 3;

    // DOM Elements
    const form = document.getElementById('multiStepForm');
    const steps = document.querySelectorAll('.step');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const submitBtn = document.getElementById('submitBtn');

    // 1. FIELD VALIDATION RULES
    function validateField(input) {
      const errorSpan = input.nextElementSibling;
      let isValid = true;
      let message = '';

      if (input.validity.valueMissing) {
        isValid = false;
        message = 'This field is required.';
      } else if (input.validity.typeMismatch && input.type === 'email') {
        isValid = false;
        message = 'Please enter a valid email address.';
      } else if (input.validity.tooShort) {
        isValid = false;
        message = `Minimum length is ${input.minLength} characters.`;
      }

      if (!isValid) {
        input.classList.add('invalid');
        input.classList.remove('valid');
        if (errorSpan) errorSpan.textContent = message;
      } else {
        input.classList.remove('invalid');
        input.classList.add('valid');
        if (errorSpan) errorSpan.textContent = '';
      }

      return isValid;
    }

    // 2. LIVE INPUT EVENTS
    // Event 1 & 2: 'input' and 'blur' for real-time validation feedback
    const inputs = form.querySelectorAll('input, select');
    inputs.forEach(input => {
      input.addEventListener('input', () => validateField(input));
      input.addEventListener('blur', () => validateField(input));
    });

    // 3. STEP NAVIGATION LOGIC
    function validateCurrentStep() {
      const activeStepEl = document.querySelector(`.step[data-step="${currentStep}"]`);
      const stepInputs = activeStepEl.querySelectorAll('input, select');
      let stepValid = true;

      stepInputs.forEach(input => {
        const isFieldValid = validateField(input);
        if (!isFieldValid) stepValid = false;
      });

      return stepValid;
    }

    function updateStepDisplay() {
      // Toggle steps visibility
      steps.forEach(step => {
        step.classList.toggle('active', parseInt(step.dataset.step) === currentStep);
      });

      // Update progress indicators
      for (let i = 1; i <= totalSteps; i++) {
        const indicator = document.getElementById(`p-${i}`);
        indicator.classList.toggle('active', i === currentStep);
        indicator.classList.toggle('completed', i < currentStep);
      }

      // Update buttons state
      prevBtn.style.display = currentStep === 1 ? 'none' : 'block';
      if (currentStep === totalSteps) {
        nextBtn.style.display = 'none';
        submitBtn.style.display = 'block';
      } else {
        nextBtn.style.display = 'block';
        submitBtn.style.display = 'none';
      }
    }

    // Event 3 & 4: 'click' handlers for step navigation
    nextBtn.addEventListener('click', () => {
      if (validateCurrentStep()) {
        currentStep++;
        updateStepDisplay();
      }
    });

    prevBtn.addEventListener('click', () => {
      currentStep--;
      updateStepDisplay();
    });

    // 4. KEYBOARD SHORTCUTS
    // Event 5: 'keydown' for accessibility & speed
    document.addEventListener('keydown', (e) => {
      // Advance step on Enter key
      if (e.key === 'Enter') {
        e.preventDefault();
        if (currentStep < totalSteps) {
          nextBtn.click();
        } else if (currentStep === totalSteps) {
          form.requestSubmit();
        }
      }

      // Reset form state on Escape key
      if (e.key === 'Escape') {
        form.reset();
        inputs.forEach(input => input.classList.remove('valid', 'invalid'));
        currentStep = 1;
        updateStepDisplay();
      }
    });

    // 5. FORM SUBMISSION
    // Event 6: 'submit' event with default prevention
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      if (validateCurrentStep()) {
        alert('Form submitted successfully!');
        form.reset();
        inputs.forEach(input => input.classList.remove('valid', 'invalid'));
        currentStep = 1;
        updateStepDisplay();
      }
    });
  </script>
</body>
</html>
