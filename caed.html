<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NOVA Store</title>


    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================= */

        body {

            min-height: 100vh;

            font-family:
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #30204f,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #123b48,
                    transparent 35%
                ),
                #08090d;

            color: white;

        }


        /* =========================
           NAVBAR
        ========================= */

        nav {

            height: 75px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                0 6%;

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);

            background:
                rgba(8,9,13,0.7);

            backdrop-filter:
                blur(15px);

            position: sticky;

            top: 0;

            z-index: 10;

        }


        .logo {

            font-size: 22px;

            font-weight: 800;

            letter-spacing: -1px;

        }


        .logo span {

            color: #8b5cf6;

        }


        .cart-button {

            border: 1px solid
                rgba(255,255,255,0.12);

            background:
                rgba(255,255,255,0.06);

            color: white;

            padding:
                10px 16px;

            border-radius: 12px;

            cursor: pointer;

            font-size: 13px;

            transition: 0.3s;

        }


        .cart-button:hover {

            background:
                rgba(255,255,255,0.12);

            transform:
                translateY(-2px);

        }


        /* =========================
           MAIN
        ========================= */

        main {

            width: 90%;

            max-width: 1200px;

            margin:
                auto;

            padding:
                60px 0;

        }


        /* =========================
           HERO
        ========================= */

        .hero {

            margin-bottom: 45px;

        }


        .badge {

            display: inline-block;

            padding:
                7px 13px;

            border-radius: 50px;

            background:
                rgba(139,92,246,0.12);

            border:
                1px solid
                rgba(139,92,246,0.25);

            color: #b8a2ff;

            font-size: 10px;

            letter-spacing: 1.5px;

            margin-bottom: 15px;

        }


        .hero h1 {

            font-size:
                clamp(38px, 6vw, 70px);

            letter-spacing:
                -4px;

            line-height:
                0.95;

            max-width: 700px;

            margin-bottom: 18px;

        }


        .hero h1 span {

            background:
                linear-gradient(
                    135deg,
                    #a78bfa,
                    #22d3ee
                );

            -webkit-background-clip:
                text;

            -webkit-text-fill-color:
                transparent;

        }


        .hero p {

            color:
                #858b9d;

            max-width:
                550px;

            line-height:
                1.7;

            font-size:
                14px;

        }


        /* =========================
           STORE LAYOUT
        ========================= */

        .store {

            display:
                grid;

            grid-template-columns:
                1fr 320px;

            gap:
                25px;

            align-items:
                start;

        }


        /* =========================
           PRODUCTS
        ========================= */

        .products {

            display:
                grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap:
                18px;

        }


        /* =========================
           PRODUCT CARD
        ========================= */

        .product-card {

            border:
                1px solid
                rgba(255,255,255,0.08);

            background:
                rgba(255,255,255,0.045);

            border-radius:
                22px;

            padding:
                15px;

            overflow:
                hidden;

            transition:
                transform 0.35s,
                border 0.35s,
                box-shadow 0.35s;

        }


        .product-card:hover {

            transform:
                translateY(-6px);

            border-color:
                rgba(139,92,246,0.3);

            box-shadow:
                0 25px 60px
                rgba(0,0,0,0.25);

        }


        /* =========================
           PRODUCT IMAGE
        ========================= */

        .product-image {

            height:
                220px;

            border-radius:
                16px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                75px;

            margin-bottom:
                18px;

            background:
                linear-gradient(
                    135deg,
                    #181622,
                    #111b24
                );

        }


        /* =========================
           PRODUCT INFO
        ========================= */

        .category {

            color:
                #777f92;

            font-size:
                10px;

            text-transform:
                uppercase;

            letter-spacing:
                1.5px;

            margin-bottom:
                7px;

        }


        .product-name {

            font-size:
                18px;

            margin-bottom:
                7px;

        }


        .description {

            color:
                #747b8d;

            font-size:
                12px;

            line-height:
                1.5;

            margin-bottom:
                18px;

        }


        .product-bottom {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

        }


        .price {

            font-size:
                18px;

            font-weight:
                700;

        }


        .add-button {

            border:
                none;

            background:
                #8b5cf6;

            color:
                white;

            padding:
                10px 14px;

            border-radius:
                10px;

            cursor:
                pointer;

            font-size:
                12px;

            font-weight:
                600;

            transition:
                0.3s;

        }


        .add-button:hover {

            background:
                #7045d8;

            transform:
                scale(1.04);

        }


        /* =========================
           CART
        ========================= */

        .cart {

            position:
                sticky;

            top:
                100px;

            border:
                1px solid
                rgba(255,255,255,0.1);

            background:
                rgba(255,255,255,0.055);

            backdrop-filter:
                blur(20px);

            border-radius:
                22px;

            padding:
                22px;

        }


        .cart-header {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            padding-bottom:
                18px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);

            margin-bottom:
                18px;

        }


        .cart-header h2 {

            font-size:
                18px;

        }


        .cart-count {

            width:
                28px;

            height:
                28px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                50%;

            background:
                #8b5cf6;

            font-size:
                11px;

            font-weight:
                bold;

        }


        /* =========================
           CART ITEMS
        ========================= */

        .cart-items {

            display:
                flex;

            flex-direction:
                column;

            gap:
                10px;

            max-height:
                400px;

            overflow-y:
                auto;

        }


        .cart-item {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

            padding:
                10px;

            border-radius:
                12px;

            background:
                rgba(255,255,255,0.045);

        }


        .cart-emoji {

            width:
                40px;

            height:
                40px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                10px;

            background:
                rgba(255,255,255,0.06);

            font-size:
                20px;

        }


        .cart-details {

            flex:
                1;

        }


        .cart-details h4 {

            font-size:
                12px;

            margin-bottom:
                4px;

        }


        .cart-details p {

            color:
                #858b9d;

            font-size:
                11px;

        }


        .remove-btn {

            border:
                none;

            background:
                transparent;

            color:
                #777f91;

            cursor:
                pointer;

            font-size:
                16px;

        }


        .remove-btn:hover {

            color:
                #ff6b6b;

        }


        /* =========================
           EMPTY CART
        ========================= */

        .empty-cart {

            text-align:
                center;

            padding:
                35px 10px;

            color:
                #676e7f;

            font-size:
                12px;

            line-height:
                1.6;

        }


        .empty-cart-icon {

            font-size:
                35px;

            display:
                block;

            margin-bottom:
                10px;

        }


        /* =========================
           CART FOOTER
        ========================= */

        .cart-footer {

            border-top:
                1px solid
                rgba(255,255,255,0.08);

            margin-top:
                18px;

            padding-top:
                18px;

        }


        .total {

            display:
                flex;

            justify-content:
                space-between;

            margin-bottom:
                15px;

        }


        .total span:first-child {

            color:
                #858b9d;

            font-size:
                13px;

        }


        .total span:last-child {

            font-size:
                20px;

            font-weight:
                bold;

        }


        .checkout {

            width:
                100%;

            border:
                none;

            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #6366f1
                );

            color:
                white;

            padding:
                13px;

            border-radius:
                12px;

            cursor:
                pointer;

            font-size:
                13px;

            font-weight:
                600;

        }


        .checkout:hover {

            opacity:
                0.9;

        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .store {

                grid-template-columns:
                    1fr;

            }


            .cart {

                position:
                    static;

            }

        }


        @media (max-width: 600px) {

            main {

                width:
                    92%;

                padding-top:
                    40px;

            }


            .products {

                grid-template-columns:
                    1fr;

            }


            .hero h1 {

                letter-spacing:
                    -2px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <nav>

        <div class="logo">
            NOVA<span>.</span>
        </div>


        <button
            class="cart-button"
            id="cartButton">

            🛒 Cart
            <span id="navCartCount">0</span>

        </button>

    </nav>


    <!-- =========================
         MAIN
    ========================= -->

    <main>


        <!-- HERO -->

        <section class="hero">

            <div class="badge">
                CURATED DIGITAL STORE
            </div>

            <h1>
                Things worth
                <span>having.</span>
            </h1>

            <p>
                A minimal collection of carefully selected
                tech essentials designed for people who
                appreciate good products.
            </p>

        </section>


        <!-- STORE -->

        <section class="store">


            <!-- PRODUCTS -->

            <div
                id="products"
                class="products">
            </div>


            <!-- CART -->

            <aside class="cart">


                <div class="cart-header">

                    <h2>
                        Your Cart
                    </h2>

                    <span
                        id="cartCount"
                        class="cart-count">

                        0

                    </span>

                </div>


                <div
                    id="cartItems"
                    class="cart-items">

                </div>


                <div class="cart-footer">

                    <div class="total">

                        <span>
                            Total
                        </span>

                        <span id="total">
                            ₹0
                        </span>

                    </div>


                    <button
                        id="checkout"
                        class="checkout">

                        Checkout →

                    </button>

                </div>


            </aside>


        </section>


    </main>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        // ==========================================
        // PRODUCT DATA
        // ==========================================

        const products = [

            {
                id: 1,
                name: "MacBook Air",
                category: "Laptop",
                price: 99900,
                emoji: "💻",
                description:
                    "Lightweight performance for work and creativity."
            },

            {
                id: 2,
                name: "AirPods Pro",
                category: "Audio",
                price: 24900,
                emoji: "🎧",
                description:
                    "Immersive sound with active noise cancellation."
            },

            {
                id: 3,
                name: "Mechanical Keyboard",
                category: "Accessories",
                price: 7999,
                emoji: "⌨️",
                description:
                    "Tactile mechanical switches for satisfying typing."
            },

            {
                id: 4,
                name: "Magic Mouse",
                category: "Accessories",
                price: 6999,
                emoji: "🖱️",
                description:
                    "A sleek wireless mouse with multi-touch control."
            }

        ];


        // ==========================================
        // CART ARRAY
        // ==========================================

        const cart = [];


        // ==========================================
        // DOM ELEMENTS
        // ==========================================

        const productsContainer =
            document.querySelector("#products");

        const cartItems =
            document.querySelector("#cartItems");

        const cartCount =
            document.querySelector("#cartCount");

        const navCartCount =
            document.querySelector("#navCartCount");

        const totalElement =
            document.querySelector("#total");

        const checkoutButton =
            document.querySelector("#checkout");


        // ==========================================
        // DISPLAY PRODUCTS
        // ==========================================

        function displayProducts() {

            const productHTML =
                products.map(product => {

                    return `

                        <article
                            class="product-card">

                            <div
                                class="product-image">

                                ${product.emoji}

                            </div>


                            <p class="category">

                                ${product.category}

                            </p>


                            <h3
                                class="product-name">

                                ${product.name}

                            </h3>


                            <p class="description">

                                ${product.description}

                            </p>


                            <div
                                class="product-bottom">

                                <span
                                    class="price">

                                    ₹${product.price.toLocaleString("en-IN")}

                                </span>


                                <button
                                    class="add-button"
                                    data-id="${product.id}">

                                    Add to Cart

                                </button>

                            </div>

                        </article>

                    `;

                });


            productsContainer.innerHTML =
                productHTML.join("");


            // Select all Add buttons

            const addButtons =
                document.querySelectorAll(".add-button");


            // Add click event

            addButtons.forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        const id =
                            Number(button.dataset.id);

                        addToCart(id);

                    }
                );

            });

        }


        // ==========================================
        // ADD TO CART
        // ==========================================

        function addToCart(id) {

            const product =
                products.find(product => product.id === id);


            if (product) {

                cart.push(product);

            }


            displayCart();

        }


        // ==========================================
        // DISPLAY CART
        // ==========================================

        function displayCart() {


            // Update cart count

            cartCount.textContent =
                cart.length;

            navCartCount.textContent =
                cart.length;


            // Empty cart

            if (cart.length === 0) {

                cartItems.innerHTML = `

                    <div class="empty-cart">

                        <span
                            class="empty-cart-icon">

                            🛒

                        </span>

                        Your cart is empty.

                        <br>

                        Add something you love!

                    </div>

                `;

                totalElement.textContent =
                    "₹0";

                return;

            }


            // Generate cart HTML

            const cartHTML =
                cart.map((product, index) => {

                    return `

                        <div
                            class="cart-item">

                            <div
                                class="cart-emoji">

                                ${product.emoji}

                            </div>


                            <div
                                class="cart-details">

                                <h4>

                                    ${product.name}

                                </h4>

                                <p>

                                    ₹${product.price.toLocaleString("en-IN")}

                                </p>

                            </div>


                            <button
                                class="remove-btn"
                                data-index="${index}">

                                ×

                            </button>

                        </div>

                    `;

                });


            cartItems.innerHTML =
                cartHTML.join("");


            // Calculate total

            let total = 0;


            cart.forEach(product => {

                total += product.price;

            });


            totalElement.textContent =
                `₹${total.toLocaleString("en-IN")}`;


            // Remove buttons

            const removeButtons =
                document.querySelectorAll(
                    ".remove-btn"
                );


            removeButtons.forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        const index =
                            Number(
                                button.dataset.index
                            );


                        cart.splice(index, 1);


                        displayCart();

                    }
                );

            });

        }


        // ==========================================
        // CHECKOUT
        // ==========================================

        checkoutButton.addEventListener(
            "click",
            () => {

                if (cart.length === 0) {

                    alert(
                        "Your cart is empty!"
                    );

                    return;

                }


                alert(
                    "Checkout feature coming soon! 🚀"
                );

            }
        );


        // ==========================================
        // INITIAL DISPLAY
        // ==========================================

        displayProducts();

        displayCart();


    </script>

</body>

</html>
