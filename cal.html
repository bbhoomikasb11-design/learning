<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Events - Scientific Calculator</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --operator: #818cf8;
      --action: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .calc-container {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.5rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Screen Display */
    .display {
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1rem;
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-height: 80px;
      justify-content: center;
      overflow: hidden;
    }

    .history-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      min-height: 1.2rem;
      word-break: break-all;
    }

    .current-text {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
      word-break: break-all;
    }

    /* Keypad Grid */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
    }

    button {
      background-color: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 0.5rem;
      padding: 0.85rem 0;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.1s, transform 0.05s;
    }

    button:hover {
      background-color: var(--border);
    }

    button:active {
      transform: scale(0.96);
    }

    button.btn-op {
      color: var(--accent);
    }

    button.btn-fn {
      color: var(--operator);
      font-size: 0.95rem;
    }

    button.btn-clear {
      color: var(--action);
    }

    button.btn-equals {
      background-color: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    button.btn-equals:hover {
      opacity: 0.9;
    }

    .span-two {
      grid-column: span 2;
    }

    .footer-hint {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="calc-container">
    <div class="display">
      <div class="history-text" id="historyText"></div>
      <div class="current-text" id="currentText">0</div>
    </div>

    <div class="keypad" id="keypad">
      <button class="btn-clear" data-action="clear">AC</button>
      <button class="btn-clear" data-action="delete">DEL</button>
      <button class="btn-fn" data-value="^">xⁿ</button>
      <button class="btn-op" data-value="/">÷</button>

      <button class="btn-fn" data-fn="sqrt">√</button>
      <button class="btn-fn" data-fn="sin">sin</button>
      <button class="btn-fn" data-fn="cos">cos</button>
      <button class="btn-op" data-value="*">×</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="btn-op" data-value="-">−</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="btn-op" data-value="+">+</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="btn-equals span-two" style="grid-row: span 2;" data-action="calculate">=</button>

      <button class="span-two" data-value="0">0</button>
      <button data-value=".">.</button>
    </div>

    <p class="footer-hint">Supports direct Numpad & Keyboard input</p>
  </div>

  <script>
    // Calculator State
    let currentInput = '0';
    let previousInput = '';
    let operation = null;
    let shouldResetDisplay = false;

    // DOM Elements
    const currentText = document.getElementById('currentText');
    const historyText = document.getElementById('historyText');
    const keypad = document.getElementById('keypad');

    // UI Render Helper
    function updateDisplay() {
      currentText.textContent = currentInput;
      if (operation != null) {
        historyText.textContent = `${previousInput} ${operation}`;
      } else {
        historyText.textContent = previousInput;
      }
    }

    // Input Handlers
    function appendNumber(number) {
      if (currentInput === '0' || shouldResetDisplay) {
        currentInput = number;
        shouldResetDisplay = false;
      } else {
        if (number === '.' && currentInput.includes('.')) return;
        currentInput += number;
      }
      updateDisplay();
    }

    function chooseOperation(op) {
      if (currentInput === '' && op !== '-') return;
      if (previousInput !== '') {
        calculate();
      }
      operation = op;
      previousInput = currentInput;
      shouldResetDisplay = true;
      updateDisplay();
    }

    function applyFunction(fn) {
      let num = parseFloat(currentInput);
      if (isNaN(num)) return;

      switch (fn) {
        case 'sqrt':
          if (num < 0) {
            currentInput = 'Error';
            updateDisplay();
            shouldResetDisplay = true;
            return;
          }
          currentInput = Math.sqrt(num).toString();
          break;
        case 'sin':
          currentInput = Math.sin(num * (Math.PI / 180)).toFixed(8).replace(/\.?0+$/, '');
          break;
        case 'cos':
          currentInput = Math.cos(num * (Math.PI / 180)).toFixed(8).replace(/\.?0+$/, '');
          break;
      }
      shouldResetDisplay = true;
      updateDisplay();
    }

    function calculate() {
      let result;
      const prev = parseFloat(previousInput);
      const current = parseFloat(currentInput);

      if (isNaN(prev) || isNaN(current)) return;

      switch (operation) {
        case '+':
          result = prev + current;
          break;
        case '-':
          result = prev - current;
          break;
        case '*':
          result = prev * current;
          break;
        case '/':
          if (current === 0) {
            currentInput = 'Cannot divide by 0';
            previousInput = '';
            operation = null;
            updateDisplay();
            shouldResetDisplay = true;
            return;
          }
          result = prev / current;
          break;
        case '^':
          result = Math.pow(prev, current);
          break;
        default:
          return;
      }

      currentInput = result.toString();
      previousInput = `${prev} ${operation} ${current} =`;
      operation = null;
      shouldResetDisplay = true;
      updateDisplay();
    }

    function clearAll() {
      currentInput = '0';
      previousInput = '';
      operation = null;
      updateDisplay();
    }

    function deleteLast() {
      if (shouldResetDisplay) return;
      if (currentInput.length === 1 || currentInput === 'Error') {
        currentInput = '0';
      } else {
        currentInput = currentInput.slice(0, -1);
      }
      updateDisplay();
    }

    // 1. EVENT DELEGATION FOR KEYPAD CLICKS
    keypad.addEventListener('click', (e) => {
      const button = e.target.closest('button');
      if (!button) return;

      const val = button.dataset.value;
      const action = button.dataset.action;
      const fn = button.dataset.fn;

      if (val) {
        if (['+', '-', '*', '/', '^'].includes(val)) {
          chooseOperation(val);
        } else {
          appendNumber(val);
        }
      } else if (action) {
        if (action === 'clear') clearAll();
        if (action === 'delete') deleteLast();
        if (action === 'calculate') calculate();
      } else if (fn) {
        applyFunction(fn);
      }
    });

    // 2. KEYBOARD EVENT LISTENERS
    window.addEventListener('keydown', (e) => {
      if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
        appendNumber(e.key);
      } else if (['+', '-', '*', '/', '^'].includes(e.key)) {
        chooseOperation(e.key);
      } else if (e.key === 'Enter' || e.key === '=') {
        e.preventDefault();
        calculate();
      } else if (e.key === 'Backspace') {
        deleteLast();
      } else if (e.key === 'Escape') {
        clearAll();
      }
    });
  </script>
</body>
</html>
